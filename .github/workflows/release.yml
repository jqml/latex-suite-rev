name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eslint
      - run: npm run tsc
      - run: npm run check:json
      - run: npm run build
      - run: node --check main.js
      - name: Verify tag matches manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.TAG_NAME) throw new Error('Tag and manifest version differ')"
      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js
      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json
      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
